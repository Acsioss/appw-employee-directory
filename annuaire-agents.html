<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire des Agents - Intranet</title>
    
    <!-- Tabler CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
    
    <!-- jsTree CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/themes/default/style.min.css">
    
    <!-- Select2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="navbar navbar-expand-md navbar-light" style="background: var(--tblr-bg-surface); border-bottom: 1px solid var(--tblr-border-color);">
    <div class="container-fluid">
        <a href="#" class="navbar-brand">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                <path d="M9 7m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/>
                <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/>
            </svg>
            Annuaire des Agents
        </a>
        <div class="col-md-6 mx-auto">
            <div class="input-group" style="min-width: 400px;">
                <span class="input-group-text bg-transparent">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                        <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0"/>
                        <path d="M21 21l-6 -6"/>
                    </svg>
                </span>
                <select id="global-search" class="form-select" style="width: 100%;" data-placeholder="Rechercher un agent, un site, une entité..."></select>
            </div>
        </div>
        <button class="navbar-toggler d-md-none ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#mobile-menu">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</header>

<!-- Mobile menu -->
<div class="collapse d-md-none" id="mobile-menu">
    <div class="p-3">
        <button class="btn btn-primary w-100 mb-2" onclick="toggleDrawer('left')">Navigations</button>
        <button class="btn btn-outline-primary w-100" onclick="toggleDrawer('right')">Détails</button>
    </div>
</div>

<!-- Drawers for mobile -->
<div class="drawer-overlay" id="drawer-overlay" onclick="closeAllDrawers()"></div>
<div class="drawer" id="left-drawer">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>Navigations</h5>
        <button type="button" class="btn-close" onclick="closeAllDrawers()"></button>
    </div>
    <div id="mobile-trees"></div>
</div>
<div class="drawer drawer-right" id="right-drawer">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5>Détails</h5>
        <button type="button" class="btn-close" onclick="closeAllDrawers()"></button>
    </div>
    <div id="mobile-detail"></div>
</div>

<div class="main-wrapper">
    <!-- Panneau latéral gauche -->
    <aside class="left-panel" id="left-panel">
        <div class="tree-container">
            <ul class="nav nav-tabs mb-3" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-entities" type="button">
                        Entités
                        <span class="badge bg-blue-lt ms-1" id="entity-count">0</span>
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-sites" type="button">
                        Sites
                        <span class="badge bg-green-lt ms-1" id="site-count">0</span>
                    </button>
                </li>
            </ul>
            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-entities" role="tabpanel">
                    <input type="text" class="form-control form-control-sm tree-search mb-2" id="entity-tree-search" placeholder="Rechercher une entité...">
                    <div id="entity-tree"></div>
                </div>
                <div class="tab-pane fade" id="tab-sites" role="tabpanel">
                    <input type="text" class="form-control form-control-sm tree-search mb-2" id="site-tree-search" placeholder="Rechercher un site...">
                    <div id="site-tree"></div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Zone centrale -->
    <main class="center-panel">
        <section class="filters-section">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="text-muted small" id="active-filters-info">Aucun filtre actif</div>
                <button class="btn btn-sm btn-outline-danger" id="clear-filters" style="display:none;">Réinitialiser</button>
            </div>
        </section>

        <section class="content-area">
            <div class="content-header">
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <div class="position-relative" style="min-width:180px;">
                        <select id="filter-functions" class="form-select" multiple style="width:100%;"></select>
                        <span class="filter-active-indicator" id="function-filter-count" style="display:none;">0</span>
                    </div>
                    <div class="position-relative" style="min-width:180px;">
                        <select id="filter-groups" class="form-select" multiple style="width:100%;"></select>
                        <span class="filter-active-indicator" id="group-filter-count" style="display:none;">0</span>
                    </div>
                    <div class="position-relative" style="min-width:180px;">
                        <select id="filter-locations" class="form-select" multiple style="width:100%;"></select>
                        <span class="filter-active-indicator" id="location-filter-count" style="display:none;">0</span>
                    </div>
                </div>
                <div class="d-flex gap-2 align-items-center">
                    <div class="btn-group view-toggle">
                        <button class="btn btn-icon btn-outline-primary active" data-view="table" title="Vue tableau">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14z"/><path d="M3 10h18"/><path d="M10 3v18"/></svg>
                        </button>
                        <button class="btn btn-icon btn-outline-primary" data-view="cards" title="Vue cartes">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M3 3m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/><path d="M7 7h.013a1.657 1.657 0 0 1 1.657 1.657v0a1.657 1.657 0 0 1 -1.657 1.657h-.013a1.657 1.657 0 0 1 -1.657 -1.657v0a1.657 1.657 0 0 1 1.657 -1.657z"/><path d="M17 7h.013a1.657 1.657 0 0 1 1.657 1.657v0a1.657 1.657 0 0 1 -1.657 1.657h-.013a1.657 1.657 0 0 1 -1.657 -1.657v0a1.657 1.657 0 0 1 1.657 -1.657z"/><path d="M7 17h.013a1.657 1.657 0 0 1 1.657 1.657v0a1.657 1.657 0 0 1 -1.657 1.657h-.013a1.657 1.657 0 0 1 -1.657 -1.657v0a1.657 1.657 0 0 1 1.657 -1.657z"/><path d="M17 17h.013a1.657 1.657 0 0 1 1.657 1.657v0a1.657 1.657 0 0 1 -1.657 1.657h-.013a1.657 1.657 0 0 1 -1.657 -1.657v0a1.657 1.657 0 0 1 1.657 -1.657z"/></svg>
                        </button>
                        <button class="btn btn-icon btn-outline-primary" data-view="map" title="Vue carte">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.828 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"/></svg>
                        </button>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-icon btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" title="Exporter">
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M12 17v-6"/><path d="M9.5 14.5l2.5 2.5l2.5 -2.5"/></svg>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="#" onclick="exportData('excel'); return false;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z"/><path d="M9 15l3 3l3 -3"/><path d="M12 12v6"/></svg>
                                Excel/CSV
                            </a></li>
                            <li><a class="dropdown-item" href="#" onclick="exportData('pdf'); return false;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon me-2" width="16" height="16" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c0 1.66 -4 3 -9 3s-9 -1.34 -9 -3"/><path d="M3 5v14c0 1.66 4 3 9 3s9 -1.34 9 -3v-14"/></svg>
                                PDF
                            </a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-2 mb-2">
                <div class="text-muted small" id="active-filters-info">Aucun filtre actif</div>
                <button class="btn btn-sm btn-outline-danger" id="clear-filters" style="display:none;">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon me-1" width="14" height="14" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></svg>
                    Réinitialiser
                </button>
            </div>

            <!-- Vue Tableau -->
            <div id="table-view" style="display: flex; flex-direction: column; flex: 1;">
                <div class="table-responsive" style="flex: 1; overflow: auto;">
                    <table class="table table-hover table-vcenter agent-table">
                        <thead>
                            <tr>
                                <th>Agent</th>
                                <th>Fonction</th>
                                <th>Service</th>
                                <th>Site</th>
                                <th>Contact</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="agents-table-body"></tbody>
                    </table>
                </div>
                <div class="pagination-container">
                    <div class="text-muted small">
                        Affichage de <span id="showing-from">1</span> à <span id="showing-to">10</span> sur <span id="total-agents">0</span>
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm m-0" id="pagination"></ul>
                    </nav>
                </div>
            </div>

            <!-- Vue Cartes -->
            <div id="cards-view" style="display:none;"></div>

            <!-- Vue Carte -->
            <div id="map-view" style="display:none;">
                <div id="leaflet-map"></div>
            </div>
        </section>
    </main>

    <!-- Panneau latéral droit -->
    <aside class="right-panel" id="right-panel">
        <div class="detail-panel" id="detail-panel">
            <div id="empty-state" class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" class="empty-state-icon" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                    <path d="M10 13a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/>
                    <path d="M8 21v-1a2 2 0 0 1 2 -2h4a2 2 0 0 1 2 2v1"/>
                    <path d="M3 5a2 2 0 0 0 2 2h4a2 2 0 0 0 2 -2v-6a2 2 0 0 0 -2 -2h-4a2 2 0 0 0 -2 2v6"/>
                    <path d="M15 5a2 2 0 0 0 2 2h4a2 2 0 0 0 2 -2v-6a2 2 0 0 0 -2 -2h-4a2 2 0 0 0 -2 2v6"/>
                </svg>
                <h5>Sélectionnez un élément</h5>
                <p class="text-muted">Cliquez sur un agent, service ou site</p>
            </div>
            <div id="detail-content" style="display:none;"></div>
        </div>
    </aside>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jstree/3.3.16/jstree.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Données mockées -->
<script src="data/mock-data.js"></script>

<!-- Application principale -->
<script src="js/app.js"></script>
</body>
</html>
